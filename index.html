<!DOCTYPE html>
<html>
<head>
    <title>Kitting Labels</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 10mm;
        }

        /* LABEL GRID */
        #container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 labels across */
            gap: 8mm;
        }

        /* INDIVIDUAL LABEL */
        .label {
            border: 1px solid #000;
            padding: 8px;
            height: 55mm;
            width: 95mm;
            box-sizing: border-box;
            page-break-inside: avoid;
            font-size: 12px;
        }

        .row {
            margin-bottom: 4px;
        }

        .label strong {
            display: inline-block;
            width: 70px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10mm;
        }

        button {
            margin-bottom: 10px;
        }

        /* PRINT SETTINGS */
        @media print {
            button {
                display: none;
            }

            body {
                padding: 0;
            }

            #container {
                gap: 6mm;
            }

            .label {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>

<h2>KITTING RECEIPT LABELS</h2>

<div id="container"></div>

<button onclick="window.print()">Print</button>

<script>
    const params = new URLSearchParams(window.location.search);
    const itemsParam = params.get("items");

    const container = document.getElementById("container");

    let items = [];

    try {
        items = JSON.parse(itemsParam || "[]");
    } catch (e) {
        console.error("Invalid JSON");
    }

    items.forEach(item => {

        const label = document.createElement("div");
        label.className = "label";

        label.innerHTML = `
            <div class="row"><strong>WO:</strong> ${item.won || ""}</div>
            <div class="row"><strong>Part:</strong> ${item.pn || ""}</div>
            <div class="row"><strong>Desc:</strong> ${item.desc || ""}</div>
            <div class="row"><strong>Loc:</strong> ${item.loc || ""}</div>
            <div class="row"><strong>Qty:</strong> ${item.qty || ""}</div>
            <div class="row"><strong>Date:</strong> ${item.date || ""}</div>
        `;

        container.appendChild(label);
    });
</script>

</body>
</html>
