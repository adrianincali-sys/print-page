<!DOCTYPE html>
<html>
<head>
    <title>KITTING PACK LIST</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .box {
            border: 1px solid #000;
            padding: 10px;
            margin-bottom: 15px;
            page-break-inside: avoid;
        }

        @media print {
            button {
                display: none;
            }

            .box {
                page-break-after: always;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>

<body>

<h2>KITTING RECEIPT LABEL</h2>

<div id="container"></div>

<button onclick="window.print()">Print</button>

<script>
    const params = new URLSearchParams(window.location.search);

    // Get items parameter
    const itemsParam = params.get("items");

    // Container
    const container = document.getElementById("container");

    // Parse JSON list
    let items = [];

    try {
        items = JSON.parse(itemsParam || "[]");
    } catch (e) {
        console.error("Invalid JSON");
    }

    // Generate boxes
    items.forEach(item => {

        const box = document.createElement("div");
        box.className = "box";

        box.innerHTML = `
            <div><strong>WO:</strong> ${item.won || ""}</div> <!--work order number for the item-->
            <div><strong>Part:</strong> ${item.pn || ""}</div> <!--part number for the item-->
            <div><strong>Desc.:</strong> ${item.desc || ""}</div> <!--description of the item-->
            <div><strong>Location:</strong> ${item.loc || ""}</div> <!--location to be delivered to-->
            <div><strong>QTY:</strong> ${item.qty || ""}</div> <!--quantity of the part-->
            <div><strong>Date:</strong> ${item.date || ""}</div> <!--date ticket was printed-->
        `;

        container.appendChild(box);
        const barcodeValue = item.won || item.pn || "";

if (barcodeValue) {
    JsBarcode(box.querySelector(".barcode"), barcodeValue, {
        format: "CODE128",
        lineColor: "#000",
        width: 1.5,
        height: 40,
        displayValue: true,
        fontSize: 12,
        margin: 2
    });
}
    });
</script>
<h3>1.001</h3>
</body>
</html>
